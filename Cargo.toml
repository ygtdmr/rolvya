[workspace]
members = ["crates/domain", "crates/plan-validator"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ygtdmr/rolvya"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
rolvya-domain = { path = "crates/domain" }

[workspace.lints.rust]
unsafe_code = "forbid"
