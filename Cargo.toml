[workspace]
members = ["crates/domain", "crates/plan-validator", "crates/persistence-sqlite"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ygtdmr/rolvya"

[workspace.dependencies]
aws-config = { version = "=1.8.14", default-features = false, features = ["rt-tokio"] }
aws-sdk-ecs = { version = "=1.112.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-secretsmanager = { version = "=1.100.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-sts = { version = "=1.98.0", default-features = false, features = ["rt-tokio"] }
aws-credential-types = "=1.2.12"
aws-smithy-runtime-api = { version = "=1.11.4", features = ["client", "http-1x"] }
aws-smithy-types = { version = "=1.4.4", features = ["http-body-1-x"] }
http = "=1.5.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["http1", "server", "service", "tokio"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
webpki-roots = "=1.0.11"
base64 = "=0.22.1"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem", "zeroize"] }
ring = { version = "=0.17.14", default-features = false, features = ["std"] }

totp-rs = { version = "=5.7.0", default-features = false, features = ["zeroize"] }
url = "=2.5.8"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
hmac = "=0.12.1"
subtle = "=2.6.1"
poly1305 = { version = "=0.8.0", features = ["zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
zeroize = "=1.9.1"
getrandom = "=0.3.4"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
rolvya-domain = { path = "crates/domain" }

sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "=1.51.6", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process", "fs"] }
tempfile = "=3.23.0"
rolvya-plan-validator = { path = "crates/plan-validator" }

[workspace.lints.rust]
unsafe_code = "forbid"
