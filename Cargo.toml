[workspace]
members = ["crates/domain", "crates/plan-validator", "crates/persistence-sqlite"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ygtdmr/rolvya"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
hmac = "=0.12.1"
zeroize = "=1.9.1"
getrandom = "=0.3.4"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
rolvya-domain = { path = "crates/domain" }

sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = "=3.23.0"
rolvya-plan-validator = { path = "crates/plan-validator" }

[workspace.lints.rust]
unsafe_code = "forbid"
